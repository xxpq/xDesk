name: build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxtst-dev libxext-dev \
            libportal-dev libpipewire-0.3-dev \
            libsdl2-dev liblz4-dev pkg-config

      - name: Build
        run: make

      - name: Build deb package
        run: make dpkg

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if ls deskx*.deb 1>/dev/null 2>&1; then
            cp deskx*.deb artifacts/deskx_linux.deb
          fi
          if [ -f deskx ]; then
            tar -czf artifacts/deskx_linux.tar.gz deskx
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskx-linux
          path: artifacts/
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-lz4

      - name: Build (MSYS2)
        shell: msys2 {0}
        run: |
          make

      - name: Prepare artifacts
        shell: pwsh
        run: |
          # 创建 artifacts 目录
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          
          # 复制主程序文件
          if (Test-Path "deskx.exe") {
            Copy-Item "deskx.exe" -Destination "artifacts/" -Force
          } elseif (Test-Path "deskx") {
            Copy-Item "deskx" -Destination "artifacts/" -Force
          }
          
          # 复制其他 deskx 相关文件（排除 artifacts 目录）
          Get-ChildItem -Path . -Recurse -File -Exclude "*.zip","*.tar.gz" |
            Where-Object { $_.DirectoryName -notlike "*\artifacts*" -and ($_.Name -like 'deskx*' -or $_.Extension -in '.exe', '.dll') } |
            ForEach-Object {
              try {
                Copy-Item $_.FullName -Destination "artifacts/" -Force -ErrorAction SilentlyContinue
              } catch { }
            }
          
          # 压缩打包
          if (Test-Path "artifacts/deskx.exe") {
            Compress-Archive -Path "artifacts/deskx.exe" -DestinationPath "artifacts/deskx_win.zip" -Force
          } elseif (Test-Path "artifacts/deskx") {
            Compress-Archive -Path "artifacts/deskx" -DestinationPath "artifacts/deskx_win.zip" -Force
          }
          
          # 显示产物
          Get-ChildItem artifacts/

      - name: Collect DLL dependencies
        shell: msys2 {0}
        id: collect_dlls
        run: |
          # 创建 DLL 收集目录
          mkdir -p dlls

          # 获取可执行文件的 DLL 依赖列表
          if [ -f "deskx.exe" ]; then
            # 使用 ldd 列出 DLL 依赖，过滤出 MSYS2/MinGW 的 DLL
            ldd deskx.exe 2>/dev/null | grep -E "(msys|mingw|cyg)" | awk '{print $3}' | while read dll; do
              if [ -f "$dll" ]; then
                cp "$dll" dlls/ 2>/dev/null
                echo "Copied: $dll"
              fi
            done
          fi

          # 也检查 deskx (无扩展名)
          if [ -f "deskx" ]; then
            ldd deskx 2>/dev/null | grep -E "(msys|mingw|cyg)" | awk '{print $3}' | while read dll; do
              if [ -f "$dll" ] && [ ! -f "dlls/$(basename $dll)" ]; then
                cp "$dll" dlls/ 2>/dev/null
                echo "Copied: $dll"
              fi
            done
          fi

          # 列出收集到的 DLL
          echo "=== Collected DLLs ==="
          ls -la dlls/ || echo "No DLLs collected"

      - name: Prepare artifacts (with DLLs)
        shell: pwsh
        run: |
          # 创建 artifacts 目录
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # 复制主程序文件
          if (Test-Path "deskx.exe") {
            Copy-Item "deskx.exe" -Destination "artifacts/" -Force
          } elseif (Test-Path "deskx") {
            Copy-Item "deskx" -Destination "artifacts/" -Force
          }

          # 复制收集到的 DLL 文件
          if (Test-Path "dlls") {
            Get-ChildItem "dlls" -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "artifacts/" -Force
              Write-Host "Added DLL: $($_.Name)"
            }
          }

          # 复制其他 deskx 相关文件（排除 artifacts 目录）
          Get-ChildItem -Path . -Recurse -File -Exclude "*.zip","*.tar.gz" |
            Where-Object { $_.DirectoryName -notlike "*\artifacts*" -and ($_.Name -like 'deskx*' -or $_.Extension -in '.exe', '.dll') } |
            ForEach-Object {
              try {
                Copy-Item $_.FullName -Destination "artifacts/" -Force -ErrorAction SilentlyContinue
              } catch { }
            }

          # 压缩打包（包含所有 DLL）
          $archivePath = if (Test-Path "artifacts/deskx.exe") { "artifacts/deskx.exe" } elseif (Test-Path "artifacts/deskx") { "artifacts/deskx" } else { $null }
          if ($archivePath) {
            Compress-Archive -Path "artifacts\*" -DestinationPath "artifacts/deskx_win.zip" -Force
          }

          # 显示产物
          Write-Host "=== Artifacts ==="
          Get-ChildItem artifacts/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskx-windows
          path: artifacts/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        run: |
          brew install pkg-config sdl2 lz4

      - name: Build
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if [ -f deskx ]; then
            tar -czf artifacts/deskx_macos.tar.gz deskx
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskx-macos
          path: artifacts/
          retention-days: 30

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          cp -r artifacts/deskx-linux/* release/ 2>/dev/null || true
          cp -r artifacts/deskx-windows/* release/ 2>/dev/null || true
          cp -r artifacts/deskx-macos/* release/ 2>/dev/null || true
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}